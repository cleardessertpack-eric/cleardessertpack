<form class="cdp-inquiry" id="{{FORM_ID}}" name="Wholesale Inquiry Form" data-inquiry-form>
          <input type="hidden" name="item_no" value="" />
          <div class="cdp-form-grid">
            <div class="cdp-field"><label for="{{FORM_ID}}-name">Your name *</label><input id="{{FORM_ID}}-name" name="name" required autocomplete="name" placeholder="Name" /></div>
            <div class="cdp-field"><label for="{{FORM_ID}}-company">Company *</label><input id="{{FORM_ID}}-company" name="company" required autocomplete="organization" placeholder="Company name" /></div>
            <div class="cdp-field"><label for="{{FORM_ID}}-email">Business email / WhatsApp *</label><input id="{{FORM_ID}}-email" name="contact" required autocomplete="email" placeholder="name@company.com or WhatsApp" /></div>
            <div class="cdp-field"><label for="{{FORM_ID}}-market">Destination market</label><select id="{{FORM_ID}}-market" name="country"><option value="" selected>Select destination market</option><option>United Kingdom</option><option>Australia</option><option>United States</option><option>Canada</option><option>Other market</option></select></div>
            <div class="cdp-field"><label for="{{FORM_ID}}-product">Product interest</label><select id="{{FORM_ID}}-product" name="product"><option>Rectangular tiramisu box</option><option>Square dessert cup</option><option>Mini dessert cups</option><option>Family / catering tray</option><option>Dome-lid cup</option><option>Custom packaging project</option></select></div>
            <div class="cdp-field"><label for="{{FORM_ID}}-quantity">Estimated quantity</label><select id="{{FORM_ID}}-quantity" name="quantity"><option value="" selected>Not confirmed yet</option><option value="5">5 pcs (sample enquiry)</option><option>Carton order — specify quantity below</option><option>10,000–50,000 pcs</option><option>50,000–100,000 pcs</option><option>100,000+ pcs</option></select></div>
            <div class="cdp-field cdp-full"><label for="{{FORM_ID}}-message">Project details *</label><textarea id="{{FORM_ID}}-message" name="message" required placeholder="Size, capacity, lid style, branding, annual volume, destination postcode..."></textarea></div>
          </div>
          <div class="cdp-form-foot"><small>By submitting, you agree to be contacted about this packaging enquiry.</small><button class="cdp-button cdp-primary" type="submit">Send Enquiry</button></div>
        </form>
