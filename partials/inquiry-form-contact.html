<form class="cdp-inquiry" id="{{FORM_ID}}" name="Wholesale Inquiry Form" data-inquiry-form data-compact-inquiry>
          <input type="hidden" name="item_no" value="" />
          <div class="cdp-form-grid">
            <div class="cdp-field"><label for="{{FORM_ID}}-name">Your name *</label><input id="{{FORM_ID}}-name" name="name" required autocomplete="name" placeholder="Your name" /></div>
            <div class="cdp-field"><label for="{{FORM_ID}}-email">Email / WhatsApp *</label><input id="{{FORM_ID}}-email" name="contact" required placeholder="Email or WhatsApp number" /></div>
            <div class="cdp-field cdp-full"><label for="{{FORM_ID}}-product">Product or model</label><input id="{{FORM_ID}}-product" name="product" placeholder="E.g. Clear Dessert Boxes or SKU" /></div>
            <div class="cdp-field cdp-full"><label for="{{FORM_ID}}-message">What do you need?</label><textarea id="{{FORM_ID}}-message" name="message" placeholder="Size, quantity, destination or any questions"></textarea></div>
          </div>
          <div class="cdp-form-foot"><small>We’ll only contact you about your enquiry.</small><button class="cdp-button cdp-primary" type="submit">Send enquiry</button></div>
        </form>
